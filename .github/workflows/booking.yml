name: booking

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'booking/**'
      - '.github/workflows/booking.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: booking/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
